name: Deploy to Cloudflare

# Сайт обновляется сам после каждого коммита в main, который меняет страницу, колоду или настройки.
on:
  push:
    branches: [main]
    paths:
      - "prototype/index.html"
      - "decks/**"
      - "site/**"
      - "wrangler.jsonc"
      - "wrangler.placeholder.jsonc"
      - "placeholder/**"
      - "server/src/**"
      - "server/package*.json"
      - "tools/sync_secrets.js"
      - "tools/build_site.sh"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install server dependencies
        run: npm ci --omit=dev
        working-directory: server

      - name: Assemble site
        run: bash tools/build_site.sh

      - name: Deploy placeholder (kosmalis.com)
        run: npx --yes wrangler@4 deploy --config wrangler.placeholder.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy site (test.kosmalis.com)
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Sync Worker secrets (test.kosmalis.com)
        run: |
          node tools/sync_secrets.js > "$RUNNER_TEMP/secrets.json"
          if [ "$(cat "$RUNNER_TEMP/secrets.json")" != "{}" ]; then
            npx --yes wrangler@4 secret bulk "$RUNNER_TEMP/secrets.json" --name kosmalis-app
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          ADMIN_USERNAMES: ${{ secrets.ADMIN_USERNAMES }}
