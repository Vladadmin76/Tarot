<!doctype html>
<html lang="en">
<head>

<title>Kosmalis</title>
<style>
  :root { color-scheme: light; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #ffd400; color: #000;
    display: grid; place-items: center; text-align: center;
    padding: 24px; box-sizing: border-box;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  main { max-width: 1100px; }
  h1 { margin: 0 0 .35em; font-weight: 900; font-size: clamp(40px, 11vw, 140px); line-height: 1; letter-spacing: -.02em; text-transform: uppercase; }
  p { margin: .2em 0; font-weight: 700; font-size: clamp(22px, 4.6vw, 56px); line-height: 1.2; }
</style>
</head>
<body>
<main>
  <h1>We are rebuilding</h1>
  <p>Kosmalis is under reconstruction.</p>
  <p>Coming soon.</p>
</main>
